behaviors:
  missileIdentification:
      trainer_type: ppo
      hyperparameters:
        batch_size: 128
        buffer_size: 1280
        learning_rate: 1.0e-3
        beta: 0.005
        epsilon: 0.2
        lambd: 0.95
        num_epoch: 3
      network_settings:
        normalize: false
        hidden_units: 128
        num_layers: 2
        memory:
          memory_size: 64
      reward_signals:
        extrinsic:
          gamma: 0.8
          strength: 1.0
        #curiosity:
        #  strength: 0.01  # Adjust the strength of curiosity
        #  encoding_size: 256  # Size of the encoded state
      max_steps: 5.0e6
      time_horizon: 2048
      summary_freq: 5000
